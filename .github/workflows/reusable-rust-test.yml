name: Reusable Rust Testing Workflow

on:
  workflow_call:
    inputs:
      target-branch:
        description: 'Branch to checkout and test (defaults to the calling branch)'
        required: false
        type: string
        default: ''
      rust-versions:
        description: 'JSON array of Rust versions to test against'
        required: false
        type: string
        default: '["stable"]'
      platforms:
        description: 'JSON array of platforms to run tests on'
        required: false
        type: string
        default: '["ubuntu-latest"]'

jobs:
  build:
    strategy:
      matrix:
        rust-version: ${{ fromJSON(inputs.rust-versions) }}
        platform: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.platform }}
    env:
      # Keep file:line in panics while cutting multi-GB debuginfo on this generated crate.
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: DataDog/datadog-api-client-rust
          ref: ${{ inputs.target-branch || github.ref }}
      - name: Free disk space
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "Disk before cleanup:"
          df -h /
          # ubuntu-latest only guarantees ~14GB free; this crate's debug target can exceed that.
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/share/powershell || true
          sudo docker image prune --all --force || true
          echo "Disk after cleanup:"
          df -h /
      - name: Install Rust
        id: rust
        run: |
          rustup toolchain install ${{ matrix.rust-version }} --profile minimal --no-self-update && rustup default ${{ matrix.rust-version }}
          echo "version=$(rustc --version | awk '{print $2}')" >> $GITHUB_OUTPUT
        shell: bash
      - name: Cache Cargo registry
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-registry-
      - name: Cache Cargo build
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ steps.rust.outputs.version }}-${{ hashFiles('**/Cargo.toml') }}
      - name: Compile test binary
        run: cargo test --test main --no-run
        shell: bash
      - name: Stage test binary
        shell: bash
        run: |
          BINARY=$(find target/debug/deps -name 'main-*' -executable -type f | head -1)
          if [ -z "$BINARY" ]; then
            echo "No compiled test binary found in target/debug/deps"
            ls -la target/debug/deps || true
            exit 1
          fi
          echo "Staging $BINARY ($(du -h "$BINARY" | cut -f1))"
          mv "$BINARY" test-binary
      - name: Upload test binary
        uses: actions/upload-artifact@v4
        with:
          name: test-binary-${{ matrix.rust-version }}-${{ matrix.platform }}
          path: test-binary
          retention-days: 1

  test:
    needs: build
    strategy:
      matrix:
        rust-version: ${{ fromJSON(inputs.rust-versions) }}
        platform: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: DataDog/datadog-api-client-rust
          ref: ${{ inputs.target-branch || github.ref }}
      - name: Download test binary
        uses: actions/download-artifact@v4
        with:
          name: test-binary-${{ matrix.rust-version }}-${{ matrix.platform }}
      - name: Run tests
        shell: bash
        run: |
          chmod +x test-binary
          ./test-binary
