name: Reusable Integration Test Workflow

permissions:
  contents: read

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
      - labeled
      - unlabeled
  schedule:
    - cron: "0 5 * * *"
  workflow_call:
    inputs:
      target-branch:
        description: 'Branch to checkout and test (defaults to the calling branch)'
        required: false
        type: string
        default: ''
      enable-status-reporting:
        description: 'Whether to post status checks to datadog-api-spec repo'
        required: false
        type: boolean
        default: false
      status-context:
        description: 'Context for status checks'
        required: false
        type: string
        default: 'integration'
      target-repo:
        description: 'Repository to post status to'
        required: false
        type: string
        default: 'datadog-api-spec'
      has-integration-label:
        description: 'Whether the calling PR has ci/integrations label'
        required: false
        type: boolean
        default: false

concurrency:
  group: integration-rust-${{ inputs.target-branch || github.head_ref }}
  cancel-in-progress: true

jobs:
  integration_tests:
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'ci/skip') &&
      !contains(github.event.pull_request.head.ref, 'datadog-api-spec/test/') &&
      contains(github.event.pull_request.labels.*.name, 'ci/integrations')) ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_call' && inputs.has-integration-label)
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get Datadog credentials
        id: dd-sts
        uses: DataDog/dd-sts-action@2e8187910199bd93129520183c093e19aa585c75 # v1.0.0
        with:
          policy: datadog-api-client-rust
      - name: Start Datadog Agent
        run: |
          docker run -d --name datadog-agent \
            -p 8126:8126 \
            -e DD_API_KEY=${{ steps.dd-sts.outputs.api_key }} \
            -e DD_HOSTNAME=none \
            -e DD_INSIDE_CI=true \
            gcr.io/datadoghq/agent:latest
          # Wait for agent to be ready
          for i in $(seq 1 30); do
            if docker inspect --format='{{.State.Health.Status}}' datadog-agent 2>/dev/null | grep -q healthy; then
              echo "Datadog Agent is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Datadog Agent failed to become healthy"
          docker logs datadog-agent
          exit 1
      - name: Get GitHub App token
        if: github.event_name == 'pull_request'
        id: get_token
        uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a # v1.0.4
        with:
          scope: DataDog/datadog-api-spec
          policy: datadog-api-client-rust.reusable-integration-test.post-status
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.target-branch || github.ref }}
      - name: Post pending status check
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref, 'datadog-api-spec/generated/') && (inputs.enable-status-reporting || github.event_name != 'workflow_call')
        uses: DataDog/github-actions/post-status-check@65b4875f33ad773d7ba4b005a2cb5f35020295f3 # v2.3.0
        with:
          github-token: ${{ steps.get_token.outputs.token }}
          repo: ${{ inputs.target-repo || 'datadog-api-spec' }}
          status: pending
          context: ${{ inputs.status-context || 'integration' }}
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
        shell: bash
      - name: Cache Cargo
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Run integration tests
        shell: bash
        run: ./run-tests.sh
        env:
          CI: "true"
          DD_AGENT_HOST: localhost
          DD_ENV: prod
          DD_SERVICE: datadog-api-client-rust
          DD_TAGS: "team:integrations-tools-and-libraries"
          DD_TEST_CLIENT_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
          DD_TEST_CLIENT_APP_KEY: ${{ steps.dd-sts.outputs.app_key }}
          RECORD: "none"
      - name: Post failure status check
        if: failure() && github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref, 'datadog-api-spec/generated/') && (inputs.enable-status-reporting || github.event_name != 'workflow_call')
        uses: DataDog/github-actions/post-status-check@65b4875f33ad773d7ba4b005a2cb5f35020295f3 # v2.3.0
        with:
          github-token: ${{ steps.get_token.outputs.token }}
          repo: ${{ inputs.target-repo || 'datadog-api-spec' }}
          status: failure
          context: ${{ inputs.status-context || 'integration' }}
      - name: Post success status check
        if: "!failure() && github.event_name == 'pull_request' && contains(github.event.pull_request.head.ref, 'datadog-api-spec/generated/') && (inputs.enable-status-reporting || github.event_name != 'workflow_call')"
        uses: DataDog/github-actions/post-status-check@65b4875f33ad773d7ba4b005a2cb5f35020295f3 # v2.3.0
        with:
          github-token: ${{ steps.get_token.outputs.token }}
          repo: ${{ inputs.target-repo || 'datadog-api-spec' }}
          status: success
          context: ${{ inputs.status-context || 'integration' }}
